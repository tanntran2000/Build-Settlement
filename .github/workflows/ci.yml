name: Quality Gate CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log Git SHA and Evidence Identity
        run: |
          echo "Checked-out HEAD SHA: $(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR Head SHA: ${{ github.event.pull_request.head.sha }}"
            echo "PR Base SHA: ${{ github.event.pull_request.base.sha }}"
          fi

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Verify dependencies (npm audit)
        run: npm audit --audit-level=moderate

      - name: Run ESLint gate
        run: npm run lint

      - name: Strict workspace typecheck (Core, Simulation, Persistence, Content, UI)
        run: npm run typecheck

      - name: Run automated unit & architecture tests (Vitest)
        run: npm test

      - name: Build all packages (Core, Simulation, UI)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests (Playwright)
        run: npm run test:smoke
