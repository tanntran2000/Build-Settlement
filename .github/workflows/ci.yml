name: Quality Gate CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Strict workspace typecheck (Core, Simulation, Persistence, Content, UI)
        run: npm run typecheck

      - name: Run automated unit & architecture tests (Vitest)
        run: npm test

      - name: Build UI package (Vite)
        run: npm run build --workspace=@haven/ui

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests (Playwright)
        run: npm run test:smoke
