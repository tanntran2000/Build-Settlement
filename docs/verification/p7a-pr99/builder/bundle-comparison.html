<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { margin:0; color:var(--foreground); font:14px/1.5 var(--font-sans,system-ui,sans-serif); }
figure { margin:0; }
figcaption { font-size:16px; font-weight:650; margin-bottom:14px; }
.row { margin-bottom:18px; }
.label { display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 18px; margin-bottom:6px; }
.label strong { font-weight:600; }
.value { font-variant-numeric:tabular-nums; }
.track { height:24px; background:var(--muted); border-radius:4px; overflow:hidden; display:flex; }
.js { background:var(--chart-1); height:24px; }
.css { background:var(--chart-2); height:24px; }
.legend { display:flex; flex-wrap:wrap; gap:8px 18px; font-size:13px; color:var(--muted-foreground); }
.key { display:inline-block; width:10px; height:10px; margin-right:5px; border-radius:2px; }
.note { font-size:12px; color:var(--muted-foreground); margin:10px 0 0; }
table { width:100%; border-collapse:collapse; margin:12px 0 0; font-size:13px; }
th,td { padding:5px 0; text-align:right; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums; }
th:first-child,td:first-child { text-align:left; }
</style>
